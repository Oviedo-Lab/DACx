url: https://Oviedo-Lab.org/DACx/
template:
  bootstrap: 5
  light-switch: true
  math-rendering: katex

navbar:
  structure:
    left:  [intro, reference, articles, tutorials, news]
    right: [search, github, lightswitch]
  components:
    intro:
      text: Introduction
      href: index.html
    reference:
      text: Package Functions
      href: reference/index.html
    github:
      icon: fab fa-github
      href: https://github.com/Oviedo-Lab/DACx

articles:
- title: Installation
  navbar: Installation
  contents:
  - install

- title: Tutorials
  navbar: Tutorials
  contents: 
  - tutorial_network_topology
  - tutorial_math
  - tutorial_membrane_temporal_dynamics
  - tutorial_SGT
  - starts_with("tutorial_")

- title: Legal
  navbar: Legal
  contents:
  - license

reference:
- title: Initialization functions
  navbar: Initialization functions
  contents:
  - starts_with("new.")
  
- title: Motif method wrappers 
  navbar: Motif method wrappers 
  contents:
  - load.projection.into.motif
  
- title: Network method wrappers 
  navbar: Network method wrappers 
  contents:
  - set.network.structure
  - fetch.network.components
  - apply.circuit.motif
  - run.SGT
  - plot.network
  - plot.network.traces
  
- title: Network cell type functions 
  navbar: Network cell type functions 
  contents:
  - print.known.celltypes
  - fetch.cell.type.params
  - add.cell.type
  - modify.cell.type
  - principal.neurons
  
- title: Analysis functions
  navbar: Analysis functions
  contents:
  - starts_with("analyze.") 
